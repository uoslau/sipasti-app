; Batas unggah untuk fitur import Sensus Ekonomi.
;
; File ini dibaca otomatis oleh PHP-FPM / FastCGI (nginx maupun Apache) untuk
; semua skrip di folder ini, tanpa perlu menyentuh php.ini. Tidak berlaku untuk
; CLI, dan tidak dibaca bila PHP berjalan sebagai modul Apache (mod_php) —
; untuk kasus itu aturannya ada di public/.htaccess.
;
; Catatan: post_max_size harus lebih besar atau sama dengan upload_max_filesize.

upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
